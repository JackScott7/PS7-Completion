name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [current, minimum]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
      - name: Prepare minimum supported PowerShell
        if: matrix.powershell == 'minimum'
        run: |
          $base = 'https://github.com/PowerShell/PowerShell/releases/download/v7.4.0'
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.4.0-win-x64.zip'
          Invoke-WebRequest "$base/PowerShell-7.4.0-win-x64.zip" -OutFile $archive
          $hashText = (Invoke-WebRequest "$base/hashes.sha256").Content
          $line = ($hashText -split "`n" | Where-Object { $_ -match 'PowerShell-7.4.0-win-x64.zip$' })
          if (-not $line -or (Get-FileHash $archive).Hash -ne ($line -split '\s+')[0]) { throw 'PowerShell archive checksum mismatch.' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'pwsh74')
      - name: Test selected PowerShell
        run: |
          $engine = if ('${{ matrix.powershell }}' -eq 'minimum') { Join-Path $env:RUNNER_TEMP 'pwsh74/pwsh.exe' } else { (Get-Command pwsh).Source }
          & $engine -NoProfile -File ./scripts/Test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Test suite failed.' }
      - run: ./scripts/Build.ps1
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Locate or install Inno Setup
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          Split-Path $compiler | Out-File $env:GITHUB_PATH -Append
      - run: ./scripts/Test-Installer.ps1 -DisposableRunner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-evidence
          path: |
            dist/installer-evidence/
            dist/builds/**/*.exe
            dist/builds/**/SHA256SUMS.txt
