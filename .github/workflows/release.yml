name: Draft release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          choco install innosetup --version=6.4.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          'C:\Program Files (x86)\Inno Setup 6' >> $env:GITHUB_PATH
      - run: ./scripts/Test.ps1
      - run: ./scripts/Build.ps1 -Installer
      - run: ./scripts/New-WinGetManifest.ps1 -BuildMetadata ./dist/latest-build.json -OutputDirectory ./dist/winget
      - name: Create draft with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $build = Get-Content ./dist/latest-build.json -Raw | ConvertFrom-Json
          $version = $build.Version
          gh release create "v$version" --target '${{ github.sha }}' --draft --title "PS7-Completion $version" --notes 'Unsigned development build. Complete all specification release gates before publication.' $build.Assets ./dist/winget/JackScott7.PS7-Completion.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
